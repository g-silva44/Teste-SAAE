{% extends 'base.html' %} {% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h4>Confirmar Exclusão</h4>
        </div>
        <div class="card-body">
          <p>
            Tem certeza de que deseja excluir a ocorrência "<strong
              >{{ ocorrencia.descricao }}</strong
            >"?
          </p>
          <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, excluir</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary"
              >Cancelar</a
            >
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
