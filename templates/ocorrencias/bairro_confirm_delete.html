{% extends 'base.html' %} {% block content %}
<div class="container mt-4">
  <h2>Confirmar Exclusão de Bairro</h2>
  <p>
    Tem certeza de que deseja excluir o bairro "<strong
      >{{ bairro.nome }}</strong
    >"?
  </p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Excluir</button>
    <a href="{% url 'listar_bairros' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
