<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAAE - Teste</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="/ocorrencias/static/ocorrencias/css/style.css"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="bg-light">
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
          <i class="fa-solid fa-droplet me-2"></i>SAAE - Juazeiro
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'dashboard' %}"
                ><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'listar_bairros' %}"
                ><i class="fa-solid fa-city me-1"></i> Bairros</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'criar_ocorrencia' %}"
                ><i class="fa-solid fa-plus-circle me-1"></i> Nova Ocorrência</a
              >
            </li>
          </ul>
          <div class="d-flex align-items-center text-white">
            <span class="me-3"
              ><i class="fa-solid fa-user me-1"></i> {{ user.username }}</span
            >
            <form action="{% url 'logout' %}" method="POST" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="fa-solid fa-right-from-bracket me-1"></i> Sair
              </button>
            </form>
          </div>
        </div>
      </div>
    </nav>
    {% endif %}

    <div class="container mb-5">{% block content %}{% endblock %}</div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
